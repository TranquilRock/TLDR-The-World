name: Daily AI Briefing

on:
  schedule:
    # Run every day at 06:00 UTC +8
    - cron: "0 22 * * *"
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  run-pipeline:
    name: Fetch, Summarise & Deliver Briefing
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI Information Pipeline
        env:
          GITHUB_MODELS_TOKEN: ${{ secrets.MODELS_API_TOKEN }}
          GITHUB_MODELS_BASE_URL: ${{ vars.MODELS_BASE_URL || 'https://models.inference.ai.azure.com' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
          RSS_MAX_ITEMS_PER_SOURCE: ${{ vars.RSS_MAX_ITEMS_PER_SOURCE || '8' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main
