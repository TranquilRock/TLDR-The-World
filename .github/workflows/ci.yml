name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pyright black isort flake8 pylint

      - name: Run linters (black, isort, flake8)
        run: |
          python -m black --version
          python -m black --check .
          isort --version
          isort --check-only .
          flake8

      - name: Run pylint
        run: |
          pylint src/ config/ tests/

      - name: Run type checks (pyright)
        run: pyright

      - name: Run tests with coverage
        run: |
          python -m pytest --cov=src --cov-report=xml -q

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
